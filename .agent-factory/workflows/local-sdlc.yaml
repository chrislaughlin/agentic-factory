apiVersion: agent-factory.dev/v1alpha1
kind: Workflow
metadata: { id: local-sdlc, version: 1.0.0 }
completionStatus: locally-verified
policy: { maximumAttemptsPerStage: 3, maximumTotalRemediationAttempts: 8 }
stages:
  - {
      id: planning,
      kind: agent,
      agentId: planner,
      outputArtifact: implementation-plan,
      requiredHarnessCapabilities: [skills, structuredOutput],
    }
  - {
      id: plan-approval,
      kind: approval,
      dependsOn: [planning],
      inputArtifacts: [implementation-plan],
      outputArtifact: approval,
    }
  - {
      id: construction,
      kind: agent,
      agentId: constructor,
      dependsOn: [plan-approval],
      inputArtifacts: [implementation-plan, remediation-request],
      outputArtifact: source-change,
      requiredHarnessCapabilities: [skills, structuredOutput],
    }
  - {
      id: test,
      kind: agent,
      agentId: tester,
      dependsOn: [construction],
      inputArtifacts: [source-change],
      outputArtifact: test-report,
      requiredHarnessCapabilities: [structuredOutput],
    }
  - {
      id: deterministic-checks,
      kind: tool,
      dependsOn: [test],
      inputArtifacts: [test-report],
      outputArtifact: command-report,
      commandIds: [test, typecheck, lint, build, security],
    }
  - {
      id: security,
      kind: agent,
      agentId: security-reviewer,
      dependsOn: [deterministic-checks],
      inputArtifacts: [source-change, test-report, command-report],
      outputArtifact: security-review,
      requiredHarnessCapabilities: [structuredOutput],
    }
  - {
      id: qa,
      kind: agent,
      agentId: qa-reviewer,
      dependsOn: [deterministic-checks],
      inputArtifacts: [implementation-plan, source-change, test-report, command-report],
      outputArtifact: qa-report,
      requiredHarnessCapabilities: [structuredOutput],
    }
  - {
      id: code-review,
      kind: agent,
      agentId: code-reviewer,
      dependsOn: [deterministic-checks],
      inputArtifacts: [implementation-plan, source-change, test-report, command-report],
      outputArtifact: code-review,
      requiredHarnessCapabilities: [structuredOutput],
    }
  - {
      id: quality-gate,
      kind: quality-gate,
      dependsOn: [security, qa, code-review],
      inputArtifacts: [test-report, command-report, security-review, qa-report, code-review],
    }
