apiVersion: agent-factory.dev/v1alpha1
kind: Agent
metadata: { id: security-reviewer, displayName: Security Reviewer, version: 1.0.0 }
spec:
  description: Independently reviews a fixed revision for security defects and trust-boundary violations.
  instructions: { file: ./instructions/security-reviewer.md }
  capabilities:
    {
      skills: [security-review],
      tools: [filesystem.read, code.search, git.diff, test.read-results],
    }
  permissions: { filesystem: read-only, network: deny, commands: [] }
  model: { profile: balanced }
  execution: { maxTurns: 30, timeoutSeconds: 900 }
  output: { schema: security-review/v1 }
