apiVersion: agent-factory.dev/v1alpha1
kind: Agent
metadata: { id: constructor, displayName: Construction Agent, version: 1.0.0 }
spec:
  description: Implements approved plans and review remediation in the exclusive writable workspace.
  instructions: { file: ./instructions/constructor.md }
  capabilities:
    {
      skills: [implement-work-item],
      tools: [filesystem.read, filesystem.write, code.search, git.diff],
    }
  permissions: { filesystem: workspace-write, network: deny, commands: [] }
  model: { profile: balanced }
  execution: { maxTurns: 40, timeoutSeconds: 1200 }
  output: { schema: source-change/v1 }
