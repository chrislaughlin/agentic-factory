apiVersion: agent-factory.dev/v1alpha1
kind: Agent
metadata: { id: qa-reviewer, displayName: QA Reviewer, version: 1.0.0 }
spec:
  description: Independently verifies acceptance criteria against a fixed tested revision.
  instructions: { file: ./instructions/qa-reviewer.md }
  capabilities: { skills: [qa-verification], tools: [filesystem.read, test.read-results] }
  permissions: { filesystem: read-only, network: deny, commands: [] }
  model: { profile: balanced }
  execution: { maxTurns: 30, timeoutSeconds: 900 }
  output: { schema: qa-report/v1 }
